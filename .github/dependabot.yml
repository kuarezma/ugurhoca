version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/matematik-platform"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Tailwind v4 ayrı PostCSS/CSS migrasyonu gerektirir
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # eslint-config-next ve eslint-plugin-jsx-a11y henüz ESLint 10 desteklemiyor
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # @testing-library/jest-dom v8 vitest 5 gerektirir (projede vitest 4 var)
      - dependency-name: "@testing-library/jest-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
