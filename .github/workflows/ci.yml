name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      e2e-enabled: ${{ steps.e2e-secrets.outputs.available }}

    # Repo Secrets tanımlıysa gerçek URL/anon key ile derlenir; yoksa boş feed ile (kod tarafı) geçer.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    defaults:
      run:
        working-directory: matematik-platform

    steps:
      - uses: actions/checkout@v5

      # Secrets doğrudan job if koşulunda kullanılamaz; yalnız varlık bilgisini aktar.
      - name: E2E secret varlığını kontrol et
        id: e2e-secrets
        run: |
          if [[ -n "$NEXT_PUBLIC_SUPABASE_URL" && -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E atlanacak: iki public Supabase secret değeri de gerekli."
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: matematik-platform/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  bundle-budget:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    defaults:
      run:
        working-directory: matematik-platform
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: matematik-platform/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: İlk yükleme JS bütçesi
        run: npm run analyze:compare -- --budget

  e2e:
    needs: quality
    if: needs.quality.outputs.e2e-enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    defaults:
      run:
        working-directory: matematik-platform
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: matematik-platform/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Üretim sunucusu ve E2E kapısı
        run: |
          node node_modules/next/dist/bin/next start > next-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 2 --output /dev/null http://localhost:3000; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat next-start.log
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat next-start.log
            echo "::error::Next.js sunucusu 60 denemede hazır olmadı."
            exit 1
          fi
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Başarısız E2E raporunu yükle
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            matematik-platform/playwright-report/
            matematik-platform/test-results/
            matematik-platform/next-start.log
          retention-days: 7
          if-no-files-found: warn
