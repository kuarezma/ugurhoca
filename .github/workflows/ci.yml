name: CI

on:
  push:
    branches:
      - main
      - master
      - 'codex/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Repo Secrets tanımlıysa gerçek URL/anon key ile derlenir; yoksa boş feed ile (kod tarafı) geçer.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    defaults:
      run:
        working-directory: matematik-platform

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: matematik-platform/package-lock.json

      - run: npm ci
      # Engelleyen kapı yalnız production bağımlılıkları: dev araçlarındaki
      # (tailwind/eslint → braces) yamasız açıklar üretim paketine girmez.
      - run: npm audit --omit=dev --audit-level=high
      - name: Tam bağımlılık denetimi (rapor, engellemez)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
