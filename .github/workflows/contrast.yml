name: Tema kontrast kapısı

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contrast:
    name: Chromium kontrast denetimi
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      CONTRAST_REPORT_PATH: artifacts/contrast-report.json
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v5

      - name: Gerekli secret değerlerini doğrula
        id: secrets_check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTOR: ${{ github.actor }}
        run: |
          missing_names=()
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [[ -z "${!name}" ]]; then
              missing_names+=("$name")
            fi
          done
          if [[ ${#missing_names[@]} -gt 0 ]]; then
            if [[ "$EVENT_NAME" == "pull_request" && "$PR_ACTOR" == "dependabot[bot]" ]]; then
              echo "::notice::Dependabot PR'larına repo secret'ları aktarılmadığı için kontrast kapısı atlanıyor (main push'ta zorunlu çalışır)."
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            for name in "${missing_names[@]}"; do
              echo "::error::Missing secret $name. Add it in Settings > Secrets and variables > Actions."
            done
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Node kur
        if: steps.secrets_check.outputs.available == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: matematik-platform/package-lock.json

      - name: Bağımlılıkları kur
        if: steps.secrets_check.outputs.available == 'true'
        run: npm ci
        working-directory: matematik-platform

      - name: Üretim derlemesi
        if: steps.secrets_check.outputs.available == 'true'
        run: npm run build
        working-directory: matematik-platform

      - name: Chromium kur
        if: steps.secrets_check.outputs.available == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: matematik-platform

      - name: Kontrast kapısını çalıştır
        id: contrast_gate
        if: steps.secrets_check.outputs.available == 'true'
        continue-on-error: true
        run: npx playwright test e2e/contrast.spec.ts
        working-directory: matematik-platform

      - name: JSON kontrast raporunu doğrula
        id: contrast_report
        if: always() && steps.secrets_check.outputs.available == 'true'
        continue-on-error: true
        run: node scripts/contrast-report.mjs "$CONTRAST_REPORT_PATH"
        working-directory: matematik-platform

      - name: Kontrast raporunu yükle
        if: always() && steps.secrets_check.outputs.available == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: contrast-report
          path: matematik-platform/artifacts/contrast-report.json
          if-no-files-found: error

      - name: Kontrast kapısını zorunlu kıl
        if: always() && steps.secrets_check.outputs.available == 'true'
        run: |
          test "${{ steps.contrast_gate.outcome }}" = "success"
          test "${{ steps.contrast_report.outcome }}" = "success"
