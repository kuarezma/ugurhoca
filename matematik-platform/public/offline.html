<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bağlantı Yok | Uğur Hoca</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --btn-bg: #2563eb;
      --btn-hover: #1d4ed8;
      --btn-text: #ffffff;
      --icon-bg: #fee2e2;
      --icon-fg: #ef4444;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f19;
        --card-bg: #111827;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --border: #1f2937;
        --btn-bg: #3b82f6;
        --btn-hover: #2563eb;
        --btn-text: #ffffff;
        --icon-bg: rgba(239, 68, 68, 0.15);
        --icon-fg: #f87171;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 26rem;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .icon-container {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1.5rem;
      background: var(--icon-bg);
      color: var(--icon-fg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon {
      width: 2rem;
      height: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.025em;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }
    button {
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 0.75rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 0.625rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
    }
    button:hover {
      background-color: var(--btn-hover);
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon-container" aria-hidden="true">
      <svg class="icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Bağlantı Yok</h1>
    <p>Bağlantı yok — internet bağlantını kontrol edip tekrar dene.</p>
    <button type="button" onclick="window.location.reload()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
      </svg>
      Yeniden dene
    </button>
  </main>
</body>
</html>
